<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MonoTree</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>
    <div class="header">
        <div class="logo"><h2>MonoTree</h2></div>
        <div class="menu">
            <a href="#">Product</a>
            <a href="#">Why Us ?</a>
            <a href="#">Cases</a>
            <a href="#">About Us</a>
            <a href="#">Blog</a>

        </div>
        <div class="right-panel">
            <div class="booking"><a href="#">Book a Demo</a></div>
            <div class="lang"><a href="#">English</a></div>
        </div>
    </div>

    <div class="hero">
        <div class="hero-left">
            <div class="heroText">
                <h1 class="heroTitle">Put people first</h1>
                <p class="heroDesc">
                    Fast, user-friendly and engaging --- transform HR into people and culture, and streamline your daily operations with your own branded app.
                </p>
            </div>
            <div class="rating">
                <div class="stars">
                    <i class="fa-solid fa-star"></i>
                    <i class="fa-solid fa-star"></i>
                    <i class="fa-solid fa-star"></i>
                    <i class="fa-solid fa-star"></i>
                    <i class="fa-solid fa-star-half-stroke"></i>
                </div>

                <div class="ratingText">
                    <label class="ratingNum">4.9</label>
                    <label class="ratingText">Average user rating</label>
                </div>
            </div>


            <div class="log">
                    <div class="activity_percentage">
                        <h2 class="logTitle">75.2 %</h2>
                        <label class="logDetails">Average daily activity</label>
                    </div>

                     <div class="activity_app">
                        <h2 class="logTitle">4.2</h2>
                        <label class="logDetails">Average daily app opens</label>
                    </div>
            </div>
            
        </div>
        <div class="hero-right">
            <img src="images/Screenshot 2026-03-07 at 22-35-09 Monotree - Employee App.png" alt="">
        </div>
    </div>
</body>
</html>
